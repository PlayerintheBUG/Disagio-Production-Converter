name: Build & Release ffgui

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: Linux
            target: x86_64-unknown-linux-gnu
            binary_name: ffgui
            asset_name: ffgui-linux-x86_64.tar.gz

          - os: windows-latest
            os_name: Windows
            target: x86_64-pc-windows-msvc
            binary_name: ffgui.exe
            asset_name: ffgui-windows-x86_64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-3-dev \
            libx11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libssl-dev

      - name: Run tests
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin ffgui

      - name: Package Linux release (tar.gz)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/ffgui-linux-x86_64
          cp target/${{ matrix.target }}/release/ffgui dist/ffgui-linux-x86_64/
          cp -r codecs dist/ffgui-linux-x86_64/
          cp -r tools dist/ffgui-linux-x86_64/
          cp README.md dist/ffgui-linux-x86_64/
          tar -czvf ${{ matrix.asset_name }} -C dist ffgui-linux-x86_64

      - name: Package Windows release (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/ffgui-windows-x86_64
          Copy-Item target/${{ matrix.target }}/release/ffgui.exe dist/ffgui-windows-x86_64/
          Copy-Item -Recurse codecs dist/ffgui-windows-x86_64/
          Copy-Item -Recurse tools dist/ffgui-windows-x86_64/
          Copy-Item README.md dist/ffgui-windows-x86_64/
          Compress-Archive -Path dist/ffgui-windows-x86_64/* -DestinationPath ${{ matrix.asset_name }} -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display downloaded files
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ffgui-linux-x86_64.tar.gz
            artifacts/ffgui-windows-x86_64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
